[package]
name = "peaq-depin-simulator"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

description = "A production-grade headless DePIN node simulator for the peaq network — generates SR25519 identities, W3C DIDs, and cryptographically-signed IoT telemetry submitted via Substrate extrinsics."
license = "MIT"
readme = "README.md"

repository = "https://github.com/Dominion77/peaq-depin-simulator"
homepage = "https://github.com/Dominion77/peaq-depin-simulator"
documentation = "https://docs.rs/peaq-depin-simulator"

authors = ["peaq DePIN Simulator Contributors"]

keywords = ["peaq", "depin", "substrate", "iot", "blockchain"]
categories = ["simulation", "cryptography", "network-programming", "command-line-utilities"]

exclude = [
    ".env",
    "peaq_metadata.scale",
    "*.json",
    "scripts/",
    "target/",
]

[dependencies]
# Substrate & subxt core
subxt = "0.50"
subxt-signer = "0.50"

# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Cryptography
sp-core = "34.0"
sp-keyring = "39.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
hex = "0.4"
rand = "0.8"
dotenvy = "0.15"

[dev-dependencies]
mockito = "1.5"
tokio-test = "0.4"
